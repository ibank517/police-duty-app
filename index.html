<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเวรตำรวจ v6.0 (เพิ่มวันที่)</title>
    <style>
        :root { --p: #2c3e50; --s: #27ae60; --w: #f39c12; --bg: #f4f7f6; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 100; font-weight: bold; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-ok { background: var(--s); }
        .btn-reset { background: var(--w); width: auto; padding: 5px 10px; margin: 0; font-size: 14px; }
        .btn-line { background: #00b900; padding: 8px 12px; font-size: 12px; width: auto; margin: 0; }
        .status-badge { padding: 3px 8px; border-radius: 10px; font-size: 0.8em; font-weight: bold; }
        .available { background: #d4edda; color: #155724; }
        .busy { background: #f8d7da; color: #721c24; }
        .history-item { border-left: 5px solid var(--p); background: #fff; padding: 12px; margin-top: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: bold; color: #555; font-size: 0.9em; }
    </style>
</head>
<body>

<div id="loader" class="loading-overlay">⌛ กำลังเชื่อมต่อฐานข้อมูล...</div>

<div class="card">
    <h3>🚓 บันทึกเวรรับตัว</h3>
    
    <label>📅 วันที่เดินทาง</label>
    <input type="date" id="travelDate">

    <label>📍 จังหวัดปลายทาง</label>
    <input type="text" id="destination" placeholder="ระบุจังหวัด...">
    
    <label>👮 เลือกเจ้าหน้าที่ (3-4 คน)</label>
    <div id="selectors">
        <select id="p1" class="sel"></select>
        <select id="p2" class="sel"></select>
        <select id="p3" class="sel"></select>
        <select id="p4" class="sel"></select>
    </div>
    <button class="btn-ok" onclick="confirmDuty()">✅ บันทึกและส่งชื่อ</button>
</div>

<div class="card">
    <div class="flex-between">
        <h4>📊 สถานะชุดปัจจุบัน (<span id="count">0</span>/11)</h4>
        <button class="btn-reset" onclick="resetCycle()">🔄 รีเซ็ตคิว</button>
    </div>
    <div id="statusList" style="margin-top:15px;"></div>
</div>

<div id="historyList"></div>

<script>
    // *** 1. ใส่ URL ของคุณตรงนี้ ***
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAFf_TN74aDsxFFGKGFCoaQpvY25v8cyUWpzkfGrsfB343JzBSZj9hNxtM_LWzs_W3pw/exec"; 

    let officers = [];
    let history = [];

    // ตั้งค่าวันที่เริ่มต้นเป็นวันนี้ (เพื่อให้เจ้าหน้าที่ไม่ต้องกดเลือกเองบ่อยๆ)
    document.getElementById('travelDate').valueAsDate = new Date();

    async function loadData() {
        showLoader(true);
        try {
            const res = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            const data = await res.json();
            officers = data.officers || [];
            history = data.history || [];
            updateUI();
        } catch (e) { console.error(e); }
        showLoader(false);
    }

    async function saveData() {
        showLoader(true);
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ officers, history })
            });
            setTimeout(loadData, 1000);
        } catch (e) { alert("❌ บันทึกไม่สำเร็จ"); showLoader(false); }
    }

    function updateUI() {
        const avai = officers.filter(o => !o.hasGone);
        document.querySelectorAll('.sel').forEach((s, i) => {
            const val = s.value;
            s.innerHTML = `<option value="">-- คนที่ ${i+1} --</option>`;
            avai.forEach(o => s.innerHTML += `<option value="${o.name}">${o.name}</option>`);
            s.value = val;
        });

        document.getElementById('statusList').innerHTML = officers.map(o => `
            <div class="flex-between" style="margin-bottom:8px;">
                <span>${o.name}</span>
                <span class="status-badge ${o.hasGone ? 'busy':'available'}">${o.hasGone ? 'ไปแล้ว':'ว่าง'}</span>
            </div>
        `).join('');
        
        document.getElementById('count').innerText = officers.filter(o => o.hasGone).length;

        document.getElementById('historyList').innerHTML = history.map(h => {
            // วันที่ภาษาไทยแบบย่อ
            const d = new Date(h.date).toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit' });
            const text = `📢 รายงานเวรรับตัว\n📅 วันที่: ${d}\n📍 จ. ${h.dest}\n👥 ${h.names}`;
            const encodedText = encodeURIComponent(text);

            return `
                <div class="history-item">
                    <div class="flex-between">
                        <div>
                            <strong>📍 ${h.dest} (${d})</strong><br>
                            <small style="color:#666;">👥 ${h.names}</small>
                        </div>
                        <button class="btn-line" onclick="sendLine('${encodedText}')">🟢 LINE</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function confirmDuty() {
        const tDate = document.getElementById('travelDate').value;
        const dest = document.getElementById('destination').value.trim();
        const sel = [
            document.getElementById('p1').value,
            document.getElementById('p2').value,
            document.getElementById('p3').value,
            document.getElementById('p4').value
        ].filter(n => n !== "");
        
        if(!tDate || !dest || sel.length < 3) return alert("⚠️ กรุณากรอกวันที่ จังหวัด และเจ้าหน้าที่ให้ครบ");

        history.unshift({ date: tDate, dest: dest, names: sel.join(', ') });
        sel.forEach(name => {
            const o = officers.find(x => x.name === name);
            if(o) o.hasGone = true;
        });

        await saveData();
        document.getElementById('destination').value = "";
    }

    function sendLine(message) {
        const lineUrl = "https://line.me/R/msg/text/?" + message;
        const newWindow = window.open();
        newWindow.opener = null;
        newWindow.referrer = null;
        newWindow.location.href = lineUrl;
    }

    async function resetCycle() {
        if (confirm("ต้องการรีเซ็ตคิวเจ้าหน้าที่ทุกคนเป็น 'ว่าง' ใช่ไหม?")) {
            officers.forEach(o => o.hasGone = false);
            await saveData();
        }
    }

    function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

    loadData();
</script>
</body>
</html>
