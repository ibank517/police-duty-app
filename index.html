<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเวรตำรวจ (Database Mode)</title>
    <style>
        :root { --p: #2c3e50; --s: #27ae60; --w: #f39c12; --bg: #f4f7f6; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-ok { background: var(--s); }
        .btn-line { background: #00b900; padding: 5px; font-size: 12px; width: auto; }
        .status-badge { padding: 3px 8px; border-radius: 10px; font-size: 0.8em; }
        .available { background: #d4edda; color: #155724; }
        .busy { background: #f8d7da; color: #721c24; }
        .history-item { border-left: 5px solid var(--p); background: #fff; padding: 12px; margin-top: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="loader" class="loading-overlay">⌛ กำลังเชื่อมต่อฐานข้อมูล...</div>

<div class="card">
    <h3>🚓 จัดเวรรับตัว (Real-time)</h3>
    <input type="text" id="destination" placeholder="จังหวัดปลายทาง">
    <div id="selectors">
        <select id="p1" class="sel"></select>
        <select id="p2" class="sel"></select>
        <select id="p3" class="sel"></select>
        <select id="p4" class="sel"></select>
    </div>
    <button class="btn-ok" onclick="confirmDuty()">✅ บันทึกและส่งชื่อ</button>
</div>

<div class="card">
    <h4>📊 สถานะชุดปัจจุบัน (<span id="count">0</span>/11)</h4>
    <div id="statusList"></div>
</div>

<div id="historyList"></div>

<script>
    // *** วาง URL ของคุณที่นี่ ***
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAFf_TN74aDsxFFGKGFCoaQpvY25v8cyUWpzkfGrsfB343JzBSZj9hNxtM_LWzs_W3pw/exec"; 

    let officers = [];
    let history = [];

    async function loadData() {
        showLoader(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            officers = data.officers;
            history = data.history;
            updateUI();
        } catch (e) {
            alert("เชื่อมต่อฐานข้อมูลล้มเหลว ตรวจสอบ URL หรืออินเทอร์เน็ต");
        }
        showLoader(false);
    }

    async function saveData() {
        showLoader(true);
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // ใช้ no-cors เพื่อเลี่ยงปัญหาความปลอดภัยเบราว์เซอร์
                body: JSON.stringify({ officers, history })
            });
            // เนื่องจาก no-cors ไม่ส่งผลกลับมา เราจะหน่วงเวลาเล็กน้อยแล้วโหลดใหม่
            setTimeout(loadData, 1000);
        } catch (e) {
            alert("บันทึกไม่สำเร็จ");
            showLoader(false);
        }
    }

    function updateUI() {
        const avai = officers.filter(o => !o.hasGone);
        document.querySelectorAll('.sel').forEach((s, i) => {
            const currentVal = s.value;
            s.innerHTML = `<option value="">-- คนที่ ${i+1} --</option>`;
            avai.forEach(o => s.innerHTML += `<option value="${o.name}">${o.name}</option>`);
            s.value = currentVal;
        });

        document.getElementById('statusList').innerHTML = officers.map(o => `
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span>${o.name}</span>
                <span class="status-badge ${o.hasGone ? 'busy':'available'}">${o.hasGone ? 'ไปแล้ว':'ว่าง'}</span>
            </div>
        `).join('');
        
        document.getElementById('count').innerText = officers.filter(o => o.hasGone).length;

        document.getElementById('historyList').innerHTML = history.map(h => `
            <div class="history-item">
                <strong>📍 ${h.dest}</strong><br><small>${h.names}</small><br>
                <button class="btn-line" onclick="window.open('https://line.me/R/msg/text/?${encodeURIComponent('📍 '+h.dest+'\\n👥 '+h.names)}', '_blank')">ส่ง LINE</button>
            </div>
        `).join('');

        if(officers.length > 0 && officers.every(o => o.hasGone)) {
            alert("ครบทุกคนแล้ว! กำลังเริ่มรอบใหม่");
            officers.forEach(o => o.hasGone = false);
            saveData();
        }
    }

    async function confirmDuty() {
        const dest = document.getElementById('destination').value;
        const selected = [document.getElementById('p1').value, document.getElementById('p2').value, document.getElementById('p3').value, document.getElementById('p4').value].filter(n => n !== "");
        
        if(!dest || selected.length < 3) return alert("กรุณาระบุจังหวัดและเลือกอย่างน้อย 3 คน");

        history.unshift({ dest, names: selected.join(', '), time: new Date().toLocaleString() });
        selected.forEach(name => {
            const o = officers.find(x => x.name === name);
            if(o) o.hasGone = true;
        });

        await saveData();
        document.getElementById('destination').value = "";
    }

    function showLoader(show) {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    // เริ่มโหลดข้อมูลครั้งแรก
    loadData();
</script>
</body>
</html>
